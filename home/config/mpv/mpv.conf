# ==========================================
# WAYLAND & HARDWARE ACCELERATION
# ==========================================
vo=gpu-next
# Native Wayland GPU APIs (Vulkan is heavily preferred on modern Wayland)
gpu-api=vulkan
gpu-context=waylandvk

# Hardware Decoding (Pick the one matching your GPU brand):
# Intel/AMD: hwdec=vaapi
# NVIDIA:    hwdec=nvdec-copy or hwdec=vaapi
hwdec=auto-safe

profile=high-quality

# ==========================================
# HYPRLAND MOTION & PACING (144Hz Wayland Fix)
# ==========================================
# Wayland natively enforces its own presentation timing clock.
# Reverting to 'audio' prevents mpv from micro-stuttering against the compositor.
video-sync=audio
interpolation=no

# ==========================================
# SCREEN & BIT-DEPTH CONFIGURATION
# ==========================================
# 8-bit output lets libplacebo (gpu-next) handle high-quality software dithering
# before passing it to your screen's FRC hardware.
dither-depth=8
dither=fruit
video-output-levels=auto

# ==========================================
# SCALING ALGORITHMS (2K Target)
# ==========================================
scale=ewa_lanczos
cscale=spline36
dscale=mitchell
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes

scale-antiring=0.7
cscale-antiring=0.7
dscale-antiring=0.7

# ==========================================
# DEBANDING
# ==========================================
deband=yes
deband-iterations=4
deband-threshold=35
deband-range=16
deband-grain=4

# ==========================================
# HDR & TONE MAPPING
# ==========================================
tone-mapping=bt.2446a
target-contrast=auto
target-prim=auto
target-trc=auto
target-colorspace-hint=yes
hdr-compute-peak=yes
hdr-peak-percentile=99.995

# ==========================================
# USER INTERFACE & GENERAL QUALITY OF LIFE
# ==========================================
osd-font='Inter'
sub-font='Inter'
sub-font-size=32
sub-bold=yes
sub-italic=no

osd-on-seek=msg
osd-bar=no
save-position-on-quit=yes
keep-open=yes
cursor-autohide=1000

# ==========================================
# CACHE & BUFFERING
# ==========================================
cache=yes
demuxer-max-bytes=500MiB
demuxer-max-back-bytes=100MiB

