vo=gpu-next
gpu-api=vulkan
gpu-context=waylandvk

hwdec=auto-safe

profile=high-quality

video-sync=audio
interpolation=no

dither-depth=8
dither=fruit
video-output-levels=auto

scale=ewa_lanczos
cscale=spline36
dscale=mitchell
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes

scale-antiring=0.7
cscale-antiring=0.7
dscale-antiring=0.7

deband=yes
deband-iterations=4
deband-threshold=35
deband-range=16
deband-grain=4

tone-mapping=bt.2446a
target-contrast=auto
target-prim=auto
target-trc=auto
target-colorspace-hint=yes
hdr-compute-peak=yes
hdr-peak-percentile=99.995

osd-font='Inter'
sub-font='Inter'
sub-font-size=32
sub-bold=yes
sub-italic=no

osd-on-seek=msg
osd-bar=no
save-position-on-quit=yes
keep-open=yes
cursor-autohide=1000

cache=yes
demuxer-max-bytes=500MiB
demuxer-max-back-bytes=100MiB

